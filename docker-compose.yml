services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PLAYWRIGHT_SERVICE_URL: http://playwright:8001/scrape
      OBSCURA_SERVICE_URL: ws://obscura:9222
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./data:/app/data
    depends_on:
      playwright:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/readyz', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  playwright:
    build:
      context: ./playwright-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/healthz', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  obscura:
    image: h4ckf0r0day/obscura
    # --host 0.0.0.0 is required: the image's default binds to 127.0.0.1
    # inside the container, which the app cannot reach across the network.
    command: serve --port 9222 --host 0.0.0.0 --stealth
    restart: unless-stopped
    expose:
      - "9222"
    # The obscura image is a single static binary with no shell/wget/curl,
    # so a shell-based healthcheck is impossible; the app falls back to
    # local Chromium when obscura is unreachable.
    healthcheck:
      disable: true

