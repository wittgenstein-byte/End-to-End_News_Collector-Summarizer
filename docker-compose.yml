services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PLAYWRIGHT_SERVICE_URL: http://playwright:8001/scrape
      DB_TYPE: ${DB_TYPE:-sqlite}
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: news_collector
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    depends_on:
      playwright:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/readyz', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  playwright:
    build:
      context: ./playwright-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    shm_size: "512mb"
    mem_limit: 1536m
    expose:
      - "8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/healthz', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Optional MongoDB service — only starts when explicitly requested via:
  # docker compose --profile mongodb up -d
  mongodb:
    image: mongo:7
    profiles:
      - mongodb
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  mongo_data:


