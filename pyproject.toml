[project]
name = "news-collector-summarizer"
version = "0.1.0"
description = "Thai News Aggregator & Summarizer with FastAPI, Socket.IO, and Playwright"
readme = "Readme.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "requests",
    "beautifulsoup4",
    "fastapi",
    "trafilatura",
    "uvicorn",
    "python-socketio",
    "httpx",
    "openai",
    "pythainlp",
    "pydantic",
    "gunicorn",
    "uvloop; sys_platform != 'win32'",
    "joblib",
    "numpy",
    "scikit-learn==1.6.1",
    "playwright",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "sentencepiece>=0.2.2",
    "accelerate>=1.14.0",
    "tiktoken>=0.14.0",
    "protobuf>=7.36.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

