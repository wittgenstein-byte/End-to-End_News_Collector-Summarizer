<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="eco-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121E"/>
      <stop offset="60%" stop-color="#06221E"/>
      <stop offset="100%" stop-color="#020A10"/>
    </linearGradient>
    <linearGradient id="bull-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="eco-grid" width="40" height="30" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-opacity="0.25" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#eco-bg)"/>
  <rect width="800" height="450" fill="url(#eco-grid)"/>

  <!-- Candlestick Vector Stems & Bodies -->
  <g opacity="0.45">
    <line x1="140" y1="210" x2="140" y2="280" stroke="#10B981" stroke-width="1.5"/>
    <rect x="133" y="225" width="14" height="40" rx="2" fill="#10B981"/>
    <line x1="210" y1="190" x2="210" y2="270" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="203" y="210" width="14" height="35" rx="2" fill="#F43F5E"/>
    <line x1="590" y1="140" x2="590" y2="230" stroke="#10B981" stroke-width="1.5"/>
    <rect x="583" y="155" width="14" height="50" rx="2" fill="#10B981"/>
    <line x1="660" y1="90" x2="660" y2="190" stroke="#10B981" stroke-width="1.5"/>
    <rect x="653" y="110" width="14" height="55" rx="2" fill="#10B981"/>
  </g>

  <!-- Exponential Bullish Trend Curve -->
  <path d="M 80 340 C 240 330, 360 270, 480 200 S 640 130, 740 100 L 740 380 L 80 380 Z" fill="url(#bull-area)"/>
  <path d="M 80 340 C 240 330, 360 270, 480 200 S 640 130, 740 100" fill="none" stroke="url(#line-glow)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Hero Center Glass Badge -->
  <g transform="translate(400, 195)">
    <rect x="-140" y="-45" width="280" height="90" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.2"/>
    
    <path d="M-30 15 L-10 -5 L6 10 L28 -14 M28 -14 H16 M28 -14 V-2" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="-14" r="3" fill="#10B981"/>
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="4">ECONOMY &amp; MARKETS</text>
  <text x="400" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#6EE7B7" text-anchor="middle" letter-spacing="2">GLOBAL CAPITAL • MACRO ANALYTICS</text>
</svg>
