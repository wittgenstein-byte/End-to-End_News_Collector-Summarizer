<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="env-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C14"/>
      <stop offset="50%" stop-color="#063826"/>
      <stop offset="100%" stop-color="#01120C"/>
    </linearGradient>
    <radialGradient id="env-bloom" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#env-bg)"/>
  <rect width="800" height="450" fill="url(#env-bloom)"/>

  <!-- Organic Topographic / Biosphere Contours -->
  <g opacity="0.22" stroke="#34D399" stroke-width="1.2" fill="none">
    <path d="M 0 380 Q 200 320, 400 360 T 800 320"/>
    <path d="M 0 330 Q 250 260, 500 310 T 800 250"/>
    <path d="M 0 270 Q 300 200, 550 250 T 800 180"/>
    <circle cx="680" cy="100" r="60" stroke-dasharray="6 6"/>
    <circle cx="680" cy="100" r="90" stroke-dasharray="4 8"/>
  </g>

  <!-- Hero Central Glass Badge -->
  <g transform="translate(400, 190)">
    <rect x="-140" y="-45" width="280" height="90" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.2"/>
    
    <path d="M0 -24 C18 -18, 26 4, 0 24 C-26 4, -18 -18, 0 -24 Z" fill="none" stroke="url(#leaf-grad)" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#34D399" stroke-width="1.8"/>
    <path d="M0 -8 L10 -14 M0 2 L12 -4 M0 -8 L-10 -14 M0 2 L-12 -4" stroke="#84CC16" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ECFDF5" text-anchor="middle" letter-spacing="4">ENVIRONMENT &amp; CLIMATE</text>
  <text x="400" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#6EE7B7" text-anchor="middle" letter-spacing="2">SUSTAINABILITY • EARTH OBSERVATORY</text>
</svg>
