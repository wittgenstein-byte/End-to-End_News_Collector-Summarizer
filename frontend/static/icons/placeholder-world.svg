<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="wld-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061226"/>
      <stop offset="50%" stop-color="#0B234A"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>
    <radialGradient id="wld-bloom" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#wld-bg)"/>
  <rect width="800" height="450" fill="url(#wld-bloom)"/>

  <!-- Globe Longitude/Latitude Wireframe Background -->
  <g opacity="0.25" stroke="#38BDF8" stroke-width="1.2" fill="none" transform="translate(400, 190)">
    <circle r="130"/>
    <ellipse cx="0" cy="0" rx="130" ry="50"/>
    <ellipse cx="0" cy="0" rx="130" ry="95"/>
    <line x1="-130" y1="0" x2="130" y2="0"/>
    <ellipse cx="0" cy="0" rx="50" ry="130"/>
    <ellipse cx="0" cy="0" rx="95" ry="130"/>
    <line x1="0" y1="-130" x2="0" y2="130"/>
  </g>

  <!-- Orbital Connection Flight Paths & Geodetic Hubs -->
  <g opacity="0.45" stroke="#60A5FA" stroke-width="1.5" fill="none">
    <path d="M160 140 Q 320 60 520 130" stroke-dasharray="4 4"/>
    <circle cx="160" cy="140" r="4" fill="#38BDF8"/>
    <circle cx="520" cy="130" r="4" fill="#38BDF8"/>
    <path d="M260 280 Q 420 340 640 260" stroke-dasharray="4 4"/>
    <circle cx="260" cy="280" r="4" fill="#93C5FD"/>
    <circle cx="640" cy="260" r="4" fill="#93C5FD"/>
  </g>

  <!-- Hero Central Glass Badge -->
  <g transform="translate(400, 190)">
    <rect x="-140" y="-45" width="280" height="90" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2"/>
    
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <polygon points="0,-18 6,0 0,18 -6,0" fill="#60A5FA"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E0F2FE" text-anchor="middle" letter-spacing="4">WORLD &amp; GLOBAL AFFAIRS</text>
  <text x="400" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#7DD3FC" text-anchor="middle" letter-spacing="2">INTERNATIONAL DISPATCH • GEOPOLITICS</text>
</svg>
